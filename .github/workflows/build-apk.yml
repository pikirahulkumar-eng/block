name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: block_native
        run: npm install

      - name: Run Expo Prebuild
        working-directory: block_native
        # This automatically generates the native Android folder
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Assemble Release)
        working-directory: block_native/android
        # This compiles the Android project into an APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: block-game-release.apk
          path: block_native/android/app/build/outputs/apk/release/app-release.apk

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-container">
                <h1 class="title">2048</h1>
                <p class="subtitle">Merge the numbers and get to the <strong>2048 tile!</strong></p>
            </div>
            <div class="scores-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div class="score-val" id="score">0</div>
                </div>
                <div class="score-box best">
                    <div class="score-label">BEST</div>
                    <div class="score-val" id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <button id="new-game-btn" class="glow-btn">New Game</button>
        </div>

        <div class="game-board" id="game-board">
            <!-- 16 grid cells will be generated by JS -->
        </div>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2 id="game-status">Game Over!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="glow-btn">Try Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
